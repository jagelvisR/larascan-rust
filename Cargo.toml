[package]
name = "larascan"
version = "0.1.1"
edition = "2024"
authors = ["Jose Agelvis"]
description = "Static code security scanner for Laravel projects written in Rust"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.5.0"
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
tree-sitter = "0.27.2"
tree-sitter-php = "0.25.1"
streaming-iterator = "0.1"
